<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WAV Social</title>
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#000000;
  --ink:#f4f6f8;
  --muted:#8e98a3;
  --wave:#6fa3cf;
  --line:rgba(244,246,248,.16);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Jost",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:300;
  display:flex;justify-content:center;align-items:center;
  -webkit-tap-highlight-color:transparent;
}
/* canlı çerçeve: ortadan açılır, sonra üzerinde ışık dolaşır */
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
.frame{
  position:fixed;z-index:0;pointer-events:none;
  inset:calc(14px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px));
}
.frame i{position:absolute;background:var(--wave);opacity:.5}
.frame .t,.frame .b{left:0;right:0;height:1px;transform:scaleX(0);animation:grow-x 1.3s cubic-bezier(.6,0,.2,1) .1s forwards}
.frame .l,.frame .r{top:0;bottom:0;width:1px;transform:scaleY(0);animation:grow-y 1.3s cubic-bezier(.6,0,.2,1) .1s forwards}
.frame .t{top:0}.frame .b{bottom:0}.frame .l{left:0}.frame .r{right:0}
.frame::after{
  content:"";position:absolute;inset:0;padding:1.5px;opacity:0;
  background:conic-gradient(from var(--a),transparent 0 70%,var(--wave) 90%,#dff0ff 95%,transparent 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  filter:drop-shadow(0 0 5px var(--wave));
  animation:orbit 7s linear 1.4s infinite,fade 1s ease 1.4s forwards;
}
main{position:relative;z-index:1;width:100%;max-width:440px;padding:56px 36px;text-align:center}
.logo{
  display:block;width:min(100%,360px);height:auto;margin:0 auto;
  filter:invert(1) hue-rotate(180deg);
  animation:emerge 1.6s cubic-bezier(.2,.7,.2,1) .4s both;
}
.wave{display:block;width:132px;height:20px;margin:30px auto 26px;overflow:visible}
.wave path{
  fill:none;stroke:var(--wave);stroke-width:1.2;stroke-linecap:round;
  stroke-dasharray:1;stroke-dashoffset:1;
  animation:draw 1.2s cubic-bezier(.5,0,.2,1) 1.2s forwards;
}
.rest{animation:fade .9s ease 1.7s both}
.tag{
  font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  font-style:italic;font-weight:500;font-size:1.4rem;line-height:1.45;
  color:var(--ink);margin:0 auto 44px;max-width:24ch;
}
.links{border-top:1px solid var(--line);text-align:left}
.row{
  display:flex;align-items:center;gap:18px;min-height:84px;padding:16px 4px;
  color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line);
  transition:border-color .3s ease,padding-left .3s ease;
}
.row:hover,.row:focus-visible{border-bottom-color:var(--wave);padding-left:12px}
.row:focus-visible{outline:2px solid var(--wave);outline-offset:2px}
.row:active{opacity:.7}
.ico{flex:none;width:24px;height:24px;color:var(--ink)}
.name{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.name b{
  font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  font-weight:500;font-size:1.55rem;line-height:1.1;
}
.name span{font-size:.86rem;letter-spacing:.04em;color:var(--muted)}
.go{font-size:.9rem;letter-spacing:.06em;color:var(--wave);white-space:nowrap}
.foot{margin:34px 0 0;font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;font-style:italic;font-weight:500;font-size:1.25rem;line-height:1.3;color:var(--ink)}
.ticker{position:relative;overflow-x:clip;margin:22px 0 0;padding:14px 0;border-top:1px solid rgba(111,163,207,.35);border-bottom:1px solid rgba(111,163,207,.35)}
.marquee{overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent);mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent)}
.track{display:flex;width:max-content;animation:ticker-move 16s linear infinite;will-change:transform}
.group{display:flex;align-items:center;flex:none}
.group span{font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;font-style:italic;font-weight:500;font-size:1.2rem;line-height:1;color:var(--ink);white-space:nowrap;padding:0 22px}
.group span.caps{font-family:"Jost",system-ui,sans-serif;font-style:normal;font-weight:400;font-size:.72rem;letter-spacing:.28em;color:var(--wave);text-transform:uppercase}
.group i{flex:none;width:5px;height:5px;border-radius:50%;background:var(--wave);opacity:.7}
@keyframes ticker-move{to{transform:translateX(-50%)}}
.ticker::before,.ticker::after{
  content:"";position:absolute;left:0;width:40%;height:2px;
  background:linear-gradient(90deg,transparent,var(--wave),#dff0ff,var(--wave),transparent);
  box-shadow:0 0 10px var(--wave);
  animation:ticker-light 3.6s linear infinite;
}
.ticker::before{top:-1px}
.ticker::after{bottom:-1px;animation-delay:-1.8s}
@keyframes ticker-light{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
@keyframes emerge{from{opacity:0;filter:invert(1) hue-rotate(180deg) blur(10px);transform:scale(.97)}to{opacity:1;filter:invert(1) hue-rotate(180deg);transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes grow-x{to{transform:scaleX(1)}}
@keyframes grow-y{to{transform:scaleY(1)}}
@keyframes orbit{to{--a:360deg}}
@keyframes fade{from{opacity:0}to{opacity:1}}
</style>
</head>
